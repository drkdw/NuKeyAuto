name: 🏗 Release app

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # -----------------------------------------------------------------
  # 1. Creates/updates a "Release PR" with the next version + changelog
  # 2. Creates the tag and GitHub Release when that PR is merged
  # The signed AAB is built and uploaded to Google Play locally: the
  # upload key never leaves the developer's machine.
  # -----------------------------------------------------------------
  new-release:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Release please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
